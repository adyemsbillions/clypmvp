<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ed">
  <title>Clyp Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="clyp-core-fonts" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5.1.0">
</head>
<body class="editor-body">
  <header class="editor-topbar">
    <a class="brand compact" href="app.html" aria-label="Clyp workspace"><span class="brand-mark">C</span><span>Clyp</span></a>
    <div class="project-title">
      <input id="projectName" value="Untitled design" aria-label="Project name">
      <span id="saveStatus">Not saved yet</span>
    </div>
    <div class="toolbar-center" aria-label="Editor history and zoom">
      <button id="undoBtn" title="Undo" aria-label="Undo">↶</button>
      <button id="redoBtn" title="Redo" aria-label="Redo">↷</button>
      <div class="zoom-control">
        <select id="zoomSelect" aria-label="Zoom"><option>50%</option><option selected>75%</option><option>100%</option><option>125%</option></select>
        <span id="zoomValue">75%</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="button ghost small mobile-props-btn" id="mobilePropsBtn" type="button">Properties</button>
      <button class="button ghost small" id="saveBtn" type="button">Save</button>
      <button class="button small" id="exportBtn" type="button">Export PNG</button>
    </div>
  </header>

  <div class="editor-shell">
    <aside class="editor-left" id="editorLeft" aria-label="Design tools">
      <button class="tool-tab active" data-panel="templates" type="button"><span>▦</span><em>Templates</em></button>
      <button class="tool-tab" data-panel="elements" type="button"><span>◇</span><em>Elements</em></button>
      <button class="tool-tab" data-panel="text" type="button"><span>T</span><em>Text</em></button>
      <button class="tool-tab" data-panel="colors" type="button"><span>◉</span><em>Colours</em></button>
      <button class="tool-tab" data-panel="uploads" type="button"><span>↑</span><em>Images</em></button>
      <div class="left-panel-content" id="leftPanel"></div>
    </aside>

    <main class="canvas-area">
      <div class="canvas-stage" id="canvasStage">
        <div class="design-canvas" id="designCanvas" tabindex="0" aria-label="Design canvas"></div>
      </div>
      <div class="ai-command">
        <span class="ask-dot">✦</span>
        <input id="aiCommand" autocomplete="off" placeholder="Ask Clyp to change something…" aria-label="Ask Clyp">
        <button id="aiSend" type="button">Send</button>
      </div>
    </main>

    <aside class="editor-right" id="editorRight" aria-label="Properties and layers">
      <div class="mobile-sheet-head"><strong>Properties</strong><button id="closePropsBtn" type="button" aria-label="Close properties">×</button></div>
      <div class="properties-head"><strong>Properties</strong><button id="duplicateBtn" type="button">Duplicate</button></div>

      <div class="property-empty" id="propertyEmpty"><span>◇</span><strong>Nothing selected</strong><small>Choose an element on the canvas.</small></div>

      <div class="properties" id="properties" hidden>
        <label>Position<div class="split-input"><input type="number" id="propX" aria-label="X position"><input type="number" id="propY" aria-label="Y position"></div></label>
        <label>Size<div class="split-input"><input type="number" id="propW" min="1" aria-label="Width"><input type="number" id="propH" min="1" aria-label="Height"></div></label>
        <label>Opacity<input type="range" id="propOpacity" min="0.02" max="1" step="0.01"></label>

        <label id="textContentLabel">Text<textarea id="propText" rows="3"></textarea></label>
        <label id="fontFamilyLabel">Typeface<select id="propFont"></select></label>
        <label id="fontWeightLabel">Weight<select id="propWeight"><option value="300">Light 300</option><option value="400">Regular 400</option><option value="500">Medium 500</option><option value="600">SemiBold 600</option><option value="700">Bold 700</option><option value="800">ExtraBold 800</option><option value="900">Black 900</option></select></label>
        <label id="fontSizeLabel">Font size<input type="number" id="propFontSize" min="6" max="260"></label>
        <label id="typeSpacingLabel">Type spacing<div class="split-input"><input type="number" id="propTracking" step="0.1" aria-label="Letter spacing"><input type="number" id="propLine" step="0.01" min="0.6" max="2.5" aria-label="Line height"></div></label>
        <label id="alignLabel">Alignment<select id="propAlign"><option value="left">Left</option><option value="center">Centre</option><option value="right">Right</option></select></label>

        <label id="iconKindLabel">Icon<select id="propIcon"></select></label>
        <label id="shapeKindLabel">Shape<select id="propKind"></select></label>
        <label id="fillTypeLabel">Fill<select id="propFill"><option value="solid">Solid</option><option value="linear">Linear gradient</option><option value="radial">Radial gradient</option></select></label>
        <label id="primaryColorLabel">Primary colour<input type="color" id="propColor"></label>
        <label id="secondColorLabel">Secondary / angle<div class="split-input gradient-input"><input type="color" id="propColor2"><input type="number" id="propGradientAngle" min="0" max="360" placeholder="135°"></div></label>
        <label id="strokeLabel">Border<div class="split-input gradient-input"><input type="color" id="propStrokeColor"><input type="number" id="propStrokeWidth" min="0" max="20" step="0.5" placeholder="0"></div></label>
        <label id="shadowLabel">Shadow<div class="split-input"><input type="number" id="propShadowOpacity" min="0" max="0.9" step="0.05" placeholder="0"><input type="number" id="propShadowBlur" min="0" max="120" placeholder="24"></div></label>

        <label id="imageFitLabel">Image fit<select id="propImageFit"><option value="cover">Cover frame</option><option value="contain">Fit inside</option></select></label>
        <label id="imageBlendLabel">Blend<select id="propBlend"><option value="normal">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="soft-light">Soft light</option></select></label>
        <label id="imageMaskLabel">Edge treatment<select id="propMask"><option value="none">None</option><option value="fade-bottom">Fade bottom</option><option value="fade-left">Fade left</option><option value="fade-right">Fade right</option><option value="soft-ellipse">Soft ellipse</option></select></label>
        <label id="imageGradeLabel">Image grade<div class="grade-grid"><span>Brightness<input type="range" id="propBrightness" min="0.35" max="1.8" step="0.01"></span><span>Contrast<input type="range" id="propContrast" min="0.35" max="1.8" step="0.01"></span><span>Saturation<input type="range" id="propSaturation" min="0" max="1.8" step="0.01"></span></div></label>
        <label id="imageRadiusLabel">Corner radius<input type="number" id="propImageRadius" min="0" max="200"></label>
        <button class="button ghost small image-auto-button" id="autoBlendBtn" type="button">✦ Auto blend image</button>

        <button class="danger-link" id="deleteBtn" type="button">Delete element</button>
      </div>

      <div class="layers-section">
        <div class="properties-head"><strong>Layers</strong><span id="layerCount">0</span></div>
        <div id="layerList"></div>
      </div>
    </aside>
  </div>

  <input type="file" id="localImageInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/bootstrap.js?v=5.1.0"></script>
  <script src="js/editor.js?v=5.1.0"></script>
</body>
</html>
