<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clyp — Dashboard</title><link rel="stylesheet" href="styles.css?v=5.2.0"></head>
<body class="app-body"><aside class="app-sidebar"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>Clyp</span></a><nav><a class="selected" href="app.html"><span>⌂</span>Home</a><a href="#recent"><span>▦</span>My Designs</a><a href="templates.html"><span>◫</span>Templates</a><a href="pricing.html"><span>₦</span>Pricing</a><a href="#settings"><span>⚙</span>Settings</a></nav><div class="sidebar-bottom"><div class="usage-mini"><div class="usage-top"><b id="sidePlan">Free</b><span id="sideUsage">—</span></div><div class="progress"><i id="sideProgress" style="width:0%"></i></div><small>AI designs remaining</small></div><div class="profile-mini"><div class="avatar" id="profileAvatar">C</div><div><strong id="profileName">Clyp user</strong><small>Account</small></div></div></div></aside>
<main class="dashboard"><header class="dash-header"><div><span class="muted" id="todayLabel"></span><h1>What are you designing today?</h1></div><button class="icon-btn" aria-label="Notifications">⌁</button></header>
<section class="action-grid"><button class="action-card primary-action" data-action="ai"><span class="action-icon">✦</span><div><strong>Create with AI</strong><p>Tell us what you want.</p></div><span class="arrow">↗</span></button><button class="action-card" data-action="upload"><span class="action-icon">↑</span><div><strong>Edit a flyer</strong><p>Upload an existing design.</p></div><span class="arrow">↗</span></button><button class="action-card" data-action="template"><span class="action-icon">▦</span><div><strong>Choose a design</strong><p>Start from a template.</p></div><span class="arrow">↗</span></button></section>
<section class="dashboard-row"><div class="recent-block" id="recent"><div class="row-title"><h2>Recent designs</h2><button class="text-btn" id="refreshProjects">Refresh</button></div><div class="recent-grid" id="recentProjects"></div></div><aside class="usage-card"><span class="kicker">THIS MONTH</span><h3>Your usage</h3><div class="usage-item"><div><span>AI Designs</span><strong id="designUsage">—</strong></div><div class="progress"><i id="designProgress" style="width:0%"></i></div></div><div class="usage-item"><div><span>AI Edits</span><strong id="editUsage">—</strong></div><div class="progress"><i id="editProgress" style="width:0%"></i></div></div><a href="pricing.html">Manage plan →</a></aside></section>
</main>
<div class="modal" id="createModal" aria-hidden="true"><div class="modal-card"><button class="modal-close" data-close>×</button><div id="modalContent"></div></div></div>
<input type="file" id="flyerUpload" accept="image/png,image/jpeg,application/pdf" hidden>
<script src="js/bootstrap.js?v=5.2.0"></script><script src="js/dashboard.js?v=5.2.0"></script></body></html>
